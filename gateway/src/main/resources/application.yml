server:
  port: 8080

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity-auth
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/auth/**,/api/v1/oauth2/**,/api/v1/login/**,/api/v1/roles/**
              filters:
                - RewritePath=/api/v1/?(?<segment>.*), /$\{segment}

            - id: identity-jwks
              uri: http://localhost:8081
              predicates:
                - Path=/.well-known/jwks.json